[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/Adafruit ADS1X15 @ ^2.4.0
    adafruit/Adafruit BusIO @ ^1.14.0
    knolleary/PubSubClient @ ^2.8

board_build.filesystem = littlefs
board_build.partitions = partitions_elementiq.csv
board_build.flash_mode = qio
board_build.flash_size = 4MB
monitor_filters = esp32_exception_decoder
monitor_rts = 0
monitor_dtr = 0
; Use size-oriented optimisation and discard unused linker sections.
; LTO is intentionally disabled for compatibility with the ESP32-C3
; RISC-V toolchain bundled with the current PlatformIO Arduino platform.
build_flags =
    -Os
    -Wl,--gc-sections
    -ffunction-sections
    -fdata-sections
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
